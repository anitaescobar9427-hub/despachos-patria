<style>
/* ===== Identidad PATRIA ===== */
:root{
  color-scheme: light;
  --bg:#FDFAF6; --surface:#FFFFFF; --surface-2:#F7F2EA; --ink:#243744; --ink-2:#3B4F5D; --muted:#63717A;
  --line:#E7E3DC; --line-2:#D3D6D4;
  --brand:#1F3A4F; --brand-2:#2E5F7E; --sky:#A8C4D4; --cream:#F5EFE6; --brand-ink:#FFFFFF;
  --gold:#2E5F7E; --gold-ink:#955021; --gold-soft:#F5EFE6;
  --primary-bg:#2E5F7E; --primary-fg:#FFFFFF;
  --focus:#2E5F7E;
  --s-recibido:#955021;   --s-recibido-bg:#F6EADF;
  --s-programado:#2E5F7E; --s-programado-bg:#E4EEF3;
  --s-despachado:#8A6116; --s-despachado-bg:#F6EDD5;
  --s-entregado:#406245;  --s-entregado-bg:#E3ECE3;
  --bad:#A63A2B; --bad-bg:#F8E4E0; --warn:#955021; --warn-bg:#F6EADF; --ok:#406245; --ok-bg:#E3ECE3;
  --serie:#2E5F7E;
  --shadow:0 1px 2px rgba(31,58,79,.05),0 8px 24px rgba(31,58,79,.06);
  --shadow-lg:0 18px 50px rgba(20,38,52,.28);
  --font-ui:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-display:"Inter",system-ui,-apple-system,sans-serif;
  --font-serif:"Cinzel",Georgia,serif;
  --font-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --side-w:236px;
}

*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--font-ui);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:6px}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- estructura: barra lateral ---------- */
.shell{display:grid;grid-template-columns:var(--side-w) minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;background:var(--brand);color:#fff;display:flex;flex-direction:column;gap:18px;padding:22px 14px 16px;overflow-y:auto}
.logo-box{display:block;background:#fff;border-radius:12px;padding:14px 16px;color:var(--brand);box-shadow:0 6px 18px rgba(0,0,0,.18)}
.logo-box svg{display:block;width:100%;height:auto}
.side .tag{font-size:10.5px;letter-spacing:.26em;text-transform:uppercase;color:var(--sky);text-align:center;font-weight:600;margin-top:-4px}
.nav{display:flex;flex-direction:column;gap:3px}
.nav-label{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--sky);opacity:.85;margin:6px 12px 2px;font-weight:600}
.nav button{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:transparent;border:0;color:#E4ECF1;padding:10px 12px;border-radius:10px;font-weight:500;font-size:14.5px;white-space:nowrap;transition:background .15s}
.nav button:hover{background:rgba(255,255,255,.08);color:#fff}
.nav button[aria-current="page"]{background:var(--brand-2);color:#fff;font-weight:600;box-shadow:inset 3px 0 0 var(--sky)}
.nav .ic{font-size:18px;width:24px;text-align:center;line-height:1}
.nav .chip{margin-left:auto}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:12px;padding:12px 6px 0;border-top:1px solid rgba(255,255,255,.12)}
.lema{font:italic 15px/1.35 Georgia,"Times New Roman",serif;color:var(--sky);padding:0 6px}
.whoami{display:flex;align-items:center;gap:10px;color:#fff;font-size:13px;font-weight:600;padding:8px;border-radius:12px;background:rgba(255,255,255,.06)}
.whoami .av{width:34px;height:34px;border-radius:50%;background:var(--cream);color:var(--brand);display:grid;place-items:center;font-size:17px;flex:0 0 auto}
.whoami .who-t{display:flex;flex-direction:column;min-width:0;line-height:1.25}
.whoami .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.whoami .rol{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--sky);font-weight:600}
.whoami .btn{margin-left:auto;color:#fff!important;padding:4px 8px;min-height:28px;font-size:12px}
.whoami .btn:hover{background:rgba(255,255,255,.12)!important}
.work{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.92);backdrop-filter:saturate(1.4) blur(8px);-webkit-backdrop-filter:saturate(1.4) blur(8px);border-bottom:1px solid var(--line)}
.top-in{padding:14px 32px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.crumb{display:flex;flex-direction:column;line-height:1.3;min-width:0}
.crumb b{font-weight:600;color:var(--brand);font-size:15px}
.crumb span{font-size:12px;color:var(--muted)}
.top-actions{display:flex;gap:8px;align-items:center;margin-left:auto}
.lbl-sm{display:none}
.mob-brand{display:none}
.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin:6px 0 22px}
.pagehead .eyebrow{color:var(--brand-2);letter-spacing:.2em;margin-bottom:8px}
.pagehead h1{font:400 clamp(24px,3vw,34px)/1.2 var(--font-serif);color:var(--brand);margin:0 0 6px;letter-spacing:.01em}
.pagehead p{margin:0;color:var(--muted)}

/* ---------- buttons / chips ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line-2);background:var(--surface);
  color:var(--ink);border-radius:8px;padding:8px 14px;font-weight:600;line-height:1.1;min-height:36px;white-space:nowrap}
.btn:hover{background:var(--surface-2);border-color:var(--muted)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.primary{background:var(--primary-bg);border-color:var(--primary-bg);color:var(--primary-fg)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#12203F}
.btn.gold:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--surface-2)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.danger.armed{background:var(--bad);color:#fff}
.btn.sm{padding:5px 10px;min-height:30px;font-size:13px}
.btn.icon{padding:5px 8px;min-width:30px}
.top .btn.ghost{color:rgba(255,255,255,.8)}
.top .btn.ghost:hover{background:rgba(255,255,255,.1);color:#fff}

.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:600;line-height:1.5;
  background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line);white-space:nowrap}
.chip.bad{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.chip.warn{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.chip.ok{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.chip.recibido{background:var(--s-recibido-bg);color:var(--s-recibido);border-color:transparent}
.chip.programado{background:var(--s-programado-bg);color:var(--s-programado);border-color:transparent}
.chip.despachado{background:var(--s-despachado-bg);color:var(--s-despachado);border-color:transparent}
.chip.entregado{background:var(--s-entregado-bg);color:var(--s-entregado);border-color:transparent}
.chip.ejemplo{background:var(--gold-soft);color:var(--gold-ink);border-color:transparent;text-transform:uppercase;letter-spacing:.06em;font-size:10.5px}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor;display:inline-block}

/* ---------- page ---------- */
main{max-width:1480px;margin:0 auto;padding:16px 16px 48px}
.banner{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--gold-soft);color:var(--gold-ink);
  border:1px solid var(--gold);border-radius:10px;padding:10px 14px;margin-bottom:14px;font-weight:500}
.banner.bad{background:var(--bad-bg);color:var(--bad);border-color:var(--bad)}
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-bottom:14px}
.kpi{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px;display:flex;flex-direction:column;gap:2px}
.kpi:hover{border-color:var(--muted)}
.kpi[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.kpi .n{font-family:var(--font-display);font-weight:700;font-size:26px;line-height:1;font-variant-numeric:tabular-nums}
.kpi .l{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.02em}
.kpi.bad .n{color:var(--bad)} .kpi.warn .n{color:var(--warn)}
.kpi.zero .n{color:var(--muted)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar .grow{flex:1 1 220px;min-width:0}
.input,.select,.textarea{width:100%;background:var(--surface);border:1px solid var(--line-2);border-radius:8px;padding:8px 10px;min-height:36px}
.input:focus,.select:focus,.textarea:focus{outline:2px solid var(--focus);outline-offset:0;border-color:var(--focus)}
.textarea{resize:vertical;min-height:120px;line-height:1.5}
.toolbar .select{width:auto;min-width:150px}
h2.sec{font-family:var(--font-display);font-size:18px;margin:0 0 8px;font-weight:700;letter-spacing:-.005em}
.eyebrow{font-size:11px;letter-spacing:.09em;text-transform:uppercase;font-weight:700;color:var(--muted)}

/* ---------- board ---------- */
.board{display:grid;grid-template-columns:repeat(4,minmax(268px,1fr));gap:12px;overflow-x:auto;padding-bottom:8px;align-items:start;scroll-snap-type:x proximity}
.col{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:10px;min-height:120px;scroll-snap-align:start}
.col-h{display:flex;align-items:center;gap:8px;padding:2px 4px 10px;font-weight:700}
.col-h .dot{width:10px;height:10px}
.col-h .cnt{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--muted);font-weight:600}
.col.recibido .col-h .dot{color:var(--s-recibido)} .col.programado .col-h .dot{color:var(--s-programado)}
.col.despachado .col-h .dot{color:var(--s-despachado)} .col.entregado .col-h .dot{color:var(--s-entregado)}
.stack{display:flex;flex-direction:column;gap:8px}
.empty{color:var(--muted);text-align:center;padding:22px 8px;font-size:13px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:7px;
  box-shadow:0 1px 1px rgba(17,30,56,.04);text-align:left;width:100%;position:relative}
.card.click{cursor:pointer}
.card.click:hover{border-color:var(--muted);box-shadow:var(--shadow)}
.card.flag{border-left:4px solid var(--bad)}
.card.done{opacity:.78}
.card-top{display:flex;gap:8px;justify-content:space-between;align-items:flex-start}
.card .who{font-weight:700;line-height:1.25}
.card .where{font-size:12.5px;color:var(--muted)}
.card .oc{font-size:12px;color:var(--muted);white-space:nowrap}
.card .items{font-size:13px;color:var(--ink-2)}
.chips{display:flex;gap:5px;flex-wrap:wrap}
.card-foot{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.card-foot .meta{font-size:12px;color:var(--muted)}

/* ---------- week ---------- */
.week{display:grid;grid-template-columns:290px minmax(0,1fr);gap:14px;align-items:start}
.panel{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:10px}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.panel-h h3{margin:0;font-family:var(--font-display);font-size:15px}
.days{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(172px,1fr);gap:8px;overflow-x:auto;padding-bottom:6px}
.day{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:8px;min-height:260px;display:flex;flex-direction:column;gap:8px}
.day.today{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}
.day.over{background:var(--s-programado-bg);border-color:var(--s-programado)}
.day.over.late{background:var(--bad-bg);border-color:var(--bad)}
.day-h{display:flex;align-items:baseline;justify-content:space-between;gap:6px;padding:2px 4px 4px;border-bottom:1px solid var(--line)}
.day-h b{font-family:var(--font-display);font-size:16px}
.day-h small{color:var(--muted);font-variant-numeric:tabular-nums}
.day-sum{font-size:12px;color:var(--muted);padding:0 4px}
.rgroup{display:flex;flex-direction:column;gap:6px}
.rgroup-h{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--ink-2);padding:0 2px}
.mini{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 8px;text-align:left;width:100%;display:flex;flex-direction:column;gap:2px;cursor:pointer}
.mini:hover{border-color:var(--muted)}
.mini[draggable="true"]{cursor:grab}
.mini .t{font-weight:700;font-size:13px;line-height:1.25}
.mini .s{font-size:12px;color:var(--muted)}
.mini.done{opacity:.65}
.mini.late{border-left:3px solid var(--bad)}

/* ---------- routes ---------- */
.datenav{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.datenav .title{font-family:var(--font-display);font-weight:700;font-size:20px;min-width:180px;text-align:center}
.routes{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,430px),1fr));gap:14px;align-items:start}
.route{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);overflow:hidden}
.route-h{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.route-h .row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.route-h h3{margin:0;font-family:var(--font-display);font-size:18px}
.route-load{padding:8px 14px;background:var(--surface-2);border-bottom:1px solid var(--line);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.route-load .eyebrow{margin-right:4px}
.stops{list-style:none;margin:0;padding:0}
.stop{display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px;padding:10px 14px;border-bottom:1px solid var(--line)}
.stop:last-child{border-bottom:0}
.stop .n{width:26px;height:26px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px;font-variant-numeric:tabular-nums}
[data-theme="dark"] .stop .n{background:var(--gold);color:#111B36}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .stop .n{background:var(--gold);color:#111B36}}
.stop.entregado .n{background:var(--s-entregado);color:#fff}
.stop .body{display:flex;flex-direction:column;gap:5px;min-width:0}
.stop .who{font-weight:700}
.stop .acts{display:flex;gap:5px;flex-wrap:wrap;margin-top:3px;align-items:center}
.stop .acts .btn{padding:4px 9px;min-height:28px;font-size:12.5px}
.route-add{padding:10px 14px;border-top:1px dashed var(--line-2);background:var(--surface-2)}

/* ---------- table ---------- */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:560px}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);background:var(--surface-2)}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
.rowlist{display:flex;flex-direction:column;gap:8px}
.rowitem{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1.6fr) auto auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.rowitem .who{font-weight:700}

/* ---------- drawer ---------- */
.scrim{position:fixed;inset:0;background:rgba(8,14,30,.52);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(760px,100%);background:var(--surface);z-index:41;display:flex;flex-direction:column;box-shadow:var(--shadow-lg)}
.drawer-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:calc(12px + env(safe-area-inset-top,0px)) 18px 12px;border-bottom:1px solid var(--line)}
.drawer-h h2{margin:0;font-family:var(--font-display);font-size:20px}
.drawer-b{flex:1;overflow-y:auto;padding:16px 18px;display:flex;flex-direction:column;gap:20px}
.drawer-f{display:flex;gap:8px;flex-wrap:wrap;justify-content:space-between;padding:12px 18px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--surface)}
.drawer-f .grp{display:flex;gap:8px;flex-wrap:wrap}
.sect{display:flex;flex-direction:column;gap:10px}
.sect>.eyebrow{padding-bottom:4px;border-bottom:1px solid var(--line)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:12px;font-weight:700;color:var(--ink-2)}
.field .hint{font-size:12px;color:var(--muted)}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--surface-2);border:1px solid var(--line);padding:4px;border-radius:10px}
.steps button{border:0;background:transparent;border-radius:7px;padding:8px 4px;font-weight:600;color:var(--muted);font-size:13px}
.steps button:hover{background:var(--surface)}
.steps button[aria-pressed="true"]{color:#fff}
.steps button.recibido[aria-pressed="true"]{background:var(--s-recibido)} .steps button.programado[aria-pressed="true"]{background:var(--s-programado)}
.steps button.despachado[aria-pressed="true"]{background:var(--s-despachado)} .steps button.entregado[aria-pressed="true"]{background:var(--s-entregado)}
[data-theme="dark"] .steps button[aria-pressed="true"]{color:#0C1425}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .steps button[aria-pressed="true"]{color:#0C1425}}
.itemrow{display:grid;grid-template-columns:minmax(0,1fr) 84px 96px 36px;gap:8px;align-items:center}
.itemrow.rem{grid-template-columns:minmax(0,1fr) 74px 92px 112px 104px 36px}
@media (max-width:760px){
  .itemrow.rem{grid-template-columns:repeat(2,minmax(0,1fr)) 36px}
  .itemrow.rem>select:first-child{grid-column:1/-1}
}
.notice{border-radius:8px;padding:8px 12px;font-size:13px;font-weight:500;display:flex;gap:8px;align-items:flex-start}
.notice.warn{background:var(--warn-bg);color:var(--warn)} .notice.bad{background:var(--bad-bg);color:var(--bad)} .notice.info{background:var(--s-programado-bg);color:var(--s-programado)}
.timeline{list-style:none;margin:0;padding:0 0 0 14px;border-left:2px solid var(--line);display:flex;flex-direction:column;gap:8px}
.timeline li{position:relative;font-size:13px}
.timeline li::before{content:"";position:absolute;left:-20px;top:5px;width:8px;height:8px;border-radius:50%;background:var(--muted)}
.nov{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface-2)}
.nov.open{border-color:var(--bad)}
details.raw summary{cursor:pointer;color:var(--ink-2);font-weight:600}
details.raw pre{white-space:pre-wrap;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:10px;font-size:12.5px;max-height:220px;overflow:auto;margin:8px 0 0}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:6px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.result{border:1px solid var(--line-2);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:12px;background:var(--surface)}
.result.dup{border-color:var(--warn)}
.spin{width:16px;height:16px;border:2px solid var(--line-2);border-top-color:var(--focus);border-radius:50%;animation:sp .8s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);
  padding:10px 16px;border-radius:10px;z-index:60;box-shadow:var(--shadow-lg);max-width:min(560px,calc(100% - 32px));font-weight:500}
.toast.bad{background:var(--bad);color:#fff}
textarea.pre{font-family:var(--font-mono);font-size:12.5px;min-height:260px;line-height:1.5}

/* ---------- alistamiento ---------- */
.check{display:inline-flex;align-items:center;gap:7px;font-weight:600;color:var(--ink-2);padding:6px 10px;border:1px solid var(--line-2);border-radius:8px;background:var(--surface);min-height:36px}
.check input{width:16px;height:16px;accent-color:var(--primary-bg)}
.chip.link{cursor:pointer;border-style:dashed}
.chip.link:hover{border-color:var(--ink);color:var(--ink)}
.cliente{display:flex;flex-direction:column;gap:10px}
.cliente-h{display:flex;gap:12px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;padding-bottom:8px;border-bottom:2px solid var(--line-2)}
.cliente-h h3{margin:0;font-family:var(--font-display);font-size:19px;line-height:1.1}
.cliente-h .muted{font-size:13px}
.puntos{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));gap:12px;align-items:start}
.punto{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:9px;box-shadow:var(--shadow)}
.punto.ok{border-color:var(--ok);box-shadow:inset 3px 0 0 var(--ok),var(--shadow)}
.punto-h{display:flex;gap:8px;justify-content:space-between;align-items:flex-start;flex-wrap:wrap}
.punto-h .who{font-weight:700;font-size:15px}
.punto-f{display:flex;gap:8px;justify-content:space-between;align-items:center;flex-wrap:wrap;padding-top:8px;border-top:1px solid var(--line);font-size:12.5px}
.picklist{display:flex;flex-direction:column;gap:2px}
.pickrow{display:grid;grid-template-columns:20px 74px minmax(0,1fr);gap:9px;align-items:baseline;padding:6px 4px;border-radius:7px;cursor:pointer}
.picklist:not(.ro) .pickrow:hover{background:var(--surface-2)}
.picklist.ro .pickrow{grid-template-columns:74px minmax(0,1fr);cursor:default}
.pickrow input{width:17px;height:17px;accent-color:var(--ok);align-self:center}
.pickrow .q{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.pickrow .p{line-height:1.3}
.pickrow.done .q,.pickrow.done .p{color:var(--muted);text-decoration:line-through}


/* ---------- modal secundario (por encima del panel lateral) ---------- */
.modal-scrim{z-index:60;background:rgba(8,14,30,.6)}
.modal{position:fixed;z-index:61;left:50%;top:50%;transform:translate(-50%,-50%);width:min(560px,calc(100% - 32px));
  max-height:min(86vh,760px);display:flex;flex-direction:column;background:var(--surface);border-radius:14px;box-shadow:var(--shadow-lg)}
.modal-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.modal-h h2{margin:0;font-family:var(--font-display);font-size:19px}
.modal-b{flex:1;overflow-y:auto;padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.modal-f{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;padding:12px 18px;border-top:1px solid var(--line)}
/* ---------- ventas ---------- */
.ventas{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:14px;align-items:start;margin-bottom:18px}
.chartwrap{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px 12px}
.chartwrap h3{margin:0;font-family:var(--font-display);font-size:15px}
.chart{display:flex;align-items:flex-end;gap:10px;height:168px;padding-top:24px;border-bottom:2px solid var(--line-2);margin-top:10px}
.bar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;position:relative;border-radius:6px 6px 0 0}
.bar .fill{width:100%;max-width:54px;background:var(--serie);border-radius:4px 4px 0 0;min-height:3px}
.bar:hover .fill,.bar:focus-visible .fill{filter:brightness(1.12)}
.bar .val{font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink);margin-bottom:5px;white-space:nowrap}
.bar .tip{position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);
  padding:6px 10px;border-radius:8px;font-size:12px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .12s;z-index:6;box-shadow:var(--shadow)}
.bar:hover .tip,.bar:focus-visible .tip{opacity:1}
.chart-x{display:flex;gap:10px;padding-top:7px}
.chart-x span{flex:1;text-align:center;font-size:12px;color:var(--muted)}
.chart-x span.hoy{color:var(--ink);font-weight:700}
.toplist{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.toplist h3{margin:0 0 10px;font-family:var(--font-display);font-size:15px}
.toprow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:baseline;padding:7px 0;border-bottom:1px solid var(--line)}
.toprow:last-child{border-bottom:0}
.toprow .n{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toprow .v{font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
.toprow .s{font-size:12px;color:var(--muted)}
/* ---------- remisión ---------- */
.remision-layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,460px);gap:18px;align-items:start}
.preview{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:12px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 84px)}
.hoja{width:100%;height:auto;display:block;border:1px solid var(--line-2);border-radius:6px;background:#fff;box-shadow:var(--shadow)}
.btn.ghost.danger{color:var(--bad);border-color:transparent}
.btn.ghost.danger:hover{background:var(--bad-bg)}
/* ---------- puntos de un pedido nuevo ---------- */
.destino{border:1px solid var(--line-2);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--surface-2)}
.destino-h{display:flex;gap:8px;align-items:center;justify-content:space-between}
.destino-h b{font-family:var(--font-display);font-size:15px}
.resumen{border:1px dashed var(--line-2);border-radius:10px;padding:10px 12px;background:var(--surface-2);display:flex;flex-direction:column;gap:6px}
.dropzone{border:2px dashed var(--line-2);border-radius:12px;padding:18px;text-align:center;color:var(--muted);background:var(--surface-2)}
.dropzone.over{border-color:var(--focus);color:var(--ink)}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumbs img{height:76px;width:auto;border-radius:8px;border:1px solid var(--line-2)}

@media (max-width:1100px){
  .kpis{grid-template-columns:repeat(3,minmax(0,1fr))}
  .week{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:980px){
  .ventas{grid-template-columns:minmax(0,1fr)}
  .remision-layout{grid-template-columns:minmax(0,1fr)}
  .preview{position:static}
}
@media (max-width:720px){
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid2,.grid3{grid-template-columns:minmax(0,1fr)}
  .rowitem{grid-template-columns:minmax(0,1fr)}
  .itemrow{grid-template-columns:minmax(0,1fr) 70px 82px 34px}
  .top-in{padding:8px 16px;gap:8px}
  .top-actions .lbl{display:none}
  .top-actions .lbl-sm{display:inline}
  .brand img{height:28px}
  .brand .sep,.brand .tag{display:none}
  .nav{order:3;flex:1 0 100%}
  .nav button{padding:7px 12px}
  .datenav .title{min-width:0;flex:1}
  .board{grid-template-columns:repeat(4,86%)}
}

/* ===== Identidad PATRIA: acabados ===== */
body{background:var(--bg)}
main{max-width:1500px;margin:0 auto;padding:26px 32px 56px;width:100%}
.btn{border-radius:10px;min-height:40px;padding:9px 16px;font-weight:600;border-color:var(--line-2);color:var(--brand)}
.btn:hover{background:#EEF3F5;border-color:var(--sky)}
.btn.primary,.btn.gold{background:var(--brand-2);border-color:var(--brand-2);color:#fff}
.btn.primary:hover,.btn.gold:hover{background:var(--brand);border-color:var(--brand);filter:none}
.btn.ghost{color:var(--ink-2)}
.btn.sm{min-height:32px;padding:5px 11px;border-radius:8px}
.chip{border-radius:999px;font-weight:600;padding:3px 10px}
.kpis{gap:14px;margin-bottom:22px}
.kpi{border-radius:14px;padding:16px 18px;gap:6px;border-color:var(--line);box-shadow:var(--shadow);transition:transform .12s,border-color .12s}
.kpi:hover{transform:translateY(-1px);border-color:var(--sky)}
.kpi[aria-pressed="true"]{border-color:var(--brand-2);box-shadow:inset 0 0 0 1px var(--brand-2),var(--shadow)}
.kpi .l{order:-1;font-size:13.5px;color:var(--ink);font-weight:500;letter-spacing:0;display:flex;gap:7px;align-items:center}
.kpi .n{font-family:var(--font-ui);font-size:30px;font-weight:700;color:var(--brand)}
.kpi .d{font-size:12px;color:var(--muted)}
.kpi.bad .n{color:var(--bad)} .kpi.warn .n{color:var(--warn)} .kpi.zero .n{color:#9AA5AC}
.input,.select,.textarea{border-radius:10px;border-color:#CDD4D7;min-height:40px}
.col,.panel,.day{background:var(--surface-2);border-color:var(--line);border-radius:16px}
.col-h{font-size:14.5px;color:var(--brand)}
.col-h .ic{font-size:17px}
.card,.mini,.punto,.route,.rowitem,.urow,.chartwrap,.toplist,.result{border-radius:14px;border-color:var(--line)}
.card{box-shadow:0 1px 2px rgba(31,58,79,.05)}
.card.click:hover,.mini:hover{border-color:var(--sky);box-shadow:var(--shadow)}
.card .who,.stop .who,.punto-h .who{color:var(--brand)}
h2.sec{font:600 20px/1.25 var(--font-serif);color:var(--brand);letter-spacing:.01em;margin-bottom:12px}
.drawer-h h2,.modal-h h2,.gate-card h2{font-family:var(--font-serif);font-weight:600;color:var(--brand);letter-spacing:.01em}
.route-h h3,.cliente-h h3,.datenav .title{color:var(--brand)}
.datenav .title{font-family:var(--font-serif);font-weight:600}
.stop .n{background:var(--brand)}
.banner{background:var(--cream);color:var(--gold-ink);border-color:#E8D9C6;border-radius:14px}
.steps{border-radius:12px}
.drawer{border-radius:18px 0 0 18px}
.drawer-h{background:var(--cream)}
.gate-card{border-radius:18px;padding:26px 24px}
.gate-card .lock{background:var(--cream);font-size:24px}
.gate .logo-box{box-shadow:none;border:1px solid var(--line);padding:16px 22px}
.toast{background:var(--brand);color:#fff;border-radius:12px}
.eyebrow{color:var(--brand-2)}
body.locked .side .nav, body.locked .side .tag{display:none!important}
body.locked .top-actions{display:none}

@media (max-width:900px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .side{position:sticky;top:0;z-index:25;height:auto;flex-direction:column;gap:8px;padding:10px 12px;overflow:visible}
  .logo-box,.side .tag,.lema,.nav-label{display:none}
  .mob-brand{display:flex;align-items:center;gap:10px;color:#fff}
  .mob-brand svg{height:26px;width:auto}
  .mob-brand .wm svg{height:24px;width:auto;color:#fff}
  .nav{flex-direction:row;overflow-x:auto;scrollbar-width:none;gap:4px;margin:0 -12px;padding:0 12px}
  .nav::-webkit-scrollbar{display:none}
  .nav{align-items:center;padding-bottom:4px!important}
  .nav button{width:auto;flex:0 0 auto;height:38px;padding:0 12px;font-size:13.5px;gap:7px}
  .crumb{display:none}
  .top-in{justify-content:flex-end}
  .top:not(:has(.top-actions button:not([hidden]))){display:none}
  .nav button[aria-current="page"]{box-shadow:none}
  .side-foot{position:absolute;top:8px;right:12px;margin:0;padding:0;border:0}
  .whoami{background:transparent;padding:0}
  .whoami .who-t{display:none}
  .whoami .av{width:30px;height:30px;font-size:15px}
  .top{position:static}
  .top-in{padding:12px 16px}
  main{padding:18px 16px 48px}
  .pagehead{margin-bottom:16px}
}

/* ---------- acceso ---------- */
.gate{min-height:calc(100vh - 120px);display:grid;place-items:center;padding:24px 0}
.gate-card{width:min(420px,100%);background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:22px 20px;display:flex;flex-direction:column;gap:14px}
.gate-card h2{margin:0;font-family:var(--font-display);font-size:22px}
.gate-card .lock{width:44px;height:44px;border-radius:12px;background:var(--gold-soft);color:var(--gold-ink);display:grid;place-items:center;font-size:22px}
.pin{letter-spacing:.5em;font-family:var(--font-mono);font-size:20px;text-align:center}
.whoami{display:inline-flex;align-items:center;gap:8px;color:#fff;font-size:13px;font-weight:600;white-space:nowrap}
.whoami .rol{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);font-weight:700}
.urow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface)}
.urow.off{opacity:.6}
.urow .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
body.locked #summary, body.locked #toolbar, body.locked #banner, body.locked .nav, body.locked #btn-new, body.locked #btn-settings{display:none!important}
@media (max-width:720px){ .whoami .nm{display:none} .urow{grid-template-columns:minmax(0,1fr)} .urow .acts{justify-content:flex-start} }
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>

<body>

  const el = document.createElement(tag);
  if(attrs) for(const [k,v] of Object.entries(attrs)){
    if(v==null || v===false) continue;
    if(k==='class') el.className = v;
    else if(k.startsWith('on') && typeof v==='function') el.addEventListener(k.slice(2).toLowerCase(), v);
    else if(k==='value') continue;
    else if(k==='checked'||k==='disabled'||k==='hidden'||k==='selected'||k==='draggable') el[k] = !!v;
    else el.setAttribute(k, String(v));
  }
  for(const kid of kids.flat(Infinity)){
    if(kid==null || kid===false) continue;
    el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  }
  if(attrs && attrs.value!=null) el.value = attrs.value;
  /* los campos de fecha también responden a 'input': si se guarda sin sacar el
     foco del campo, el 'change' puede no haber llegado todavía */
  if(el.tagName==='INPUT' && el.type==='date' && attrs && typeof attrs.onChange==='function')
    el.addEventListener('input', attrs.onChange);
  return el;
}

/* Completa el peso real de catálogos guardados antes de que existiera ese campo */
/* Convierte un catálogo guardado con la nomenclatura anterior a los nombres unificados */
function migrarCatalogo(prods){
  if(!Array.isArray(prods) || !prods.some(p=>MIGRA_SKU[p.sku])) return prods;
  const out = [], fusionados = new Map();
  prods.forEach(p=>{
    const destino = MIGRA_SKU[p.sku];
    const base = destino && CATALOGO_BASE.find(x=>x.sku===destino);
    if(!base){ out.push(p); return; }
    const aliasViejo = [String(p.nombre||'').toLowerCase(), ...(p.alias||[])].filter(Boolean);
    if(fusionados.has(destino)){
      const prev = fusionados.get(destino);
      prev.alias = [...new Set([...(prev.alias||[]), ...aliasViejo])].slice(0,24);
      if(String(p.sku).startsWith('MOZ') && p.precio) prev.precio = p.precio;
      else if(!prev.precio && p.precio) prev.precio = p.precio;
      return;
    }
    const nuevo = {...clone_(base),
      precio: (p.precio!=null && p.precio!==0) ? p.precio : base.precio,
      alias: [...new Set([...(base.alias||[]), ...aliasViejo])].slice(0,24)};
    fusionados.set(destino, nuevo); out.push(nuevo);
  });
  return out;
}
function normalizarConfig(cfg){
  cfg.productos = migrarCatalogo(cfg.productos);
  (cfg.productos||[]).forEach(p=>{
    const b = CATALOGO_BASE.find(x=>x.sku===p.sku) ||
              CATALOGO_BASE.find(x=>String(x.nombre).toLowerCase()===String(p.nombre||'').toLowerCase());
    if(p.pesoUnitario==null && b) p.pesoUnitario = b.pesoUnitario;
    if(!p.familia && b) p.familia = b.familia;
    if(p.precio==null) p.precio = b ? b.precio : 0;
    if(p.ivaPct==null) p.ivaPct = b ? (+b.ivaPct||0) : 0;
  });
  CATALOGO_BASE.filter(x=>x.servicio).forEach(serv=>{
    if(!(cfg.productos||[]).some(p=>p.sku===serv.sku || norm(p.nombre)===norm(serv.nombre))) cfg.productos.push(clone_(serv));
  });
  cfg.emisor = {...clone_(DEF_EMISOR), ...(cfg.emisor||{})};
  if(!cfg.remPrefijo) cfg.remPrefijo = 'RM';
  if(!cfg.remConsecutivo) cfg.remConsecutivo = 1;
  return cfg;
}

/* ================= base de datos (real o en memoria) ================= */
function makeMemDB(){
  const cols = new Map(), subs = new Map();
  const col = n => { if(!cols.has(n)) cols.set(n,new Map()); return cols.get(n); };
  const snapOf = n => { const docs=[...col(n)].map(([id,d])=>({id,exists:true,data:()=>d})); return {docs,size:docs.length,empty:!docs.length}; };
  const emit = n => { const snap=snapOf(n); (subs.get(n)||[]).forEach(fn=>fn(snap)); };
  return { collection(n){ return {
    doc(id){ id = id || ('m'+rid(8)); return {
      id,
      async set(d){ col(n).set(id, clone(d)); emit(n); },
      async update(d){ const cur=col(n).get(id); if(!cur) throw {code:'invalid_argument'}; col(n).set(id,{...cur,...clone(d)}); emit(n); },
      async delete(){ col(n).delete(id); emit(n); }
    };},
    onSnapshot(next){ if(!subs.has(n)) subs.set(n,new Set()); subs.get(n).add(next); queueMicrotask(()=>next(snapOf(n))); return ()=>subs.get(n).delete(next); }
  };}};
}

}

/* ---- peso: gramos a partir del gramaje del catálogo ---- */
function pesoItem(i){
  if(esServicio(i.producto)) return 0;
  const q = +i.cantidad||0; if(!q) return 0;
  if(i.unidad==='kg') return q*1000;
  const prod = prodDe(i.producto);
  const g = prod && (+prod.pesoUnitario || gramajeNom(prod));
  if(!g) return null;
  if(i.unidad==='und') return q*g;
  const porCaja = prod && +prod.undPorCaja;
  if(porCaja) return q*porCaja*g;
  return null;
}
function pesoDe(items){
  let g = 0, incompleto = false;
  (items||[]).forEach(i=>{ if(!i.producto) return; const w = pesoItem(i); if(w==null) incompleto = true; else g += w; });
  return {g, incompleto};
}
const pesoPedido = p => pesoDe(p.items);
const pesoLista = pedidos => pedidos.reduce((a,p)=>{ const w=pesoPedido(p); return {g:a.g+w.g, incompleto:a.incompleto||w.incompleto}; }, {g:0, incompleto:false});
function fmtPeso(g, incompleto){
  if(g==null) return '—';
  const pre = incompleto ? '+' : '';
  if(g < 1000) return pre + Math.round(g) + ' g';
  const kg = g/1000;
  return pre + kg.toLocaleString('es-CO',{minimumFractionDigits: kg<100?1:0, maximumFractionDigits: kg<100?1:0}) + ' kg';
}
const pesoTxt = x => fmtPeso(x.g, x.incompleto);
const cfgProductos = () => S.config.productos || [];
const cfgCiudades = () => S.config.ciudades || [];
const enCatalogo = nombre => cfgProductos().some(p=>norm(p.nombre)===norm(nombre));
/* Un servicio (domicilio, flete) se cobra pero no es mercancía */
const esServicio = nombre => { const p = cfgProductos().find(x=>norm(x.nombre)===norm(nombre)); return !!(p && p.servicio); };
const soloMercancia = items => (items||[]).filter(i=>i.producto && !esServicio(i.producto));
const prodDe = nombre => cfgProductos().find(p=>norm(p.nombre)===norm(nombre)) || null;

/* Lee el gramaje escrito en un texto libre: "2,5 kg", "500g", "libra" */
function gramajeDe(txt){
  /* sin norm(): hay que conservar la coma y el punto de "2,5 kg" */
  const n = String(txt||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
  if(/media\s+libra/.test(n)) return 250;
  if(/\blibra\b/.test(n)) return 500;
  const kg = n.match(/(\d+(?:[.,]\d+)?)\s*(?:kg|kilos?|klo)\b/);
  if(kg) return Math.round(parseFloat(kg[1].replace(',','.'))*1000);
  const conUnidad = n.match(/(\d{2,4})\s*(?:g|gr|grs|gramos)\b/);
  if(conUnidad) return parseInt(conUnidad[1],10);
  const suelto = n.match(/\b(\d{2,4})\b/);
  if(suelto) return parseInt(suelto[1],10);
  return null;
}
/* El gramaje del NOMBRE comercial (500 g, 2,5 kg) — sirve para reconocer el producto.
   Es distinto del peso real de la unidad empacada, que es lo que pesa de verdad. */
const gramajeNom = p => gramajeDe(p.nombre) || +p.gramaje || null;
const FAMILIAS = [
  {k:'ghee', re:/\bghee\b|clarificada/},
  {k:'mantequilla', re:/mantequilla/},
  {k:'cheddar', re:/cheddar/},
  {k:'doblecrema', re:/doble\s?crema|\bdc\b/},
  {k:'mozzarella', re:/mo?[zs]{1,2}arell?a|muzzarella/}
];
const familiaDe = txt => (FAMILIAS.find(f=>f.re.test(norm(txt)))||{}).k || null;
/* La doble crema y la mozzarella son la misma línea desde que se unificaron los nombres */
const EQUIV_FAMILIA = {doblecrema:'mozzarella', mozzarella:'doblecrema'};
const familiaProd = p => p.familia || familiaDe(p.nombre);
/* Gramajes que reconocen a un producto: el del nombre, el comercial y el peso real */
const gramajesDe = p => [...new Set([gramajeDe(p.nombre), +p.gramaje||null, +p.pesoUnitario||null].filter(Boolean))];
/* Empareja un nombre suelto con el catálogo: exacto, alias, o familia + gramaje + variante */
function matchCatalogo(nombre){
  if(!nombre) return null;
  const cat = cfgProductos(); const n = norm(nombre);
  const exacto = cat.find(p=>norm(p.nombre)===n);
  if(exacto) return exacto;
  const porAlias = cat.find(p=>(p.alias||[]).some(a=>norm(a)===n));
  if(porAlias) return porAlias;
  const fam = familiaDe(nombre); if(!fam) return null;
  for(const f of [fam, EQUIV_FAMILIA[fam]].filter(Boolean)){
    const r = resolverEnFamilia(n, f, cat);
    if(r) return r;
  }
  return null;
}
function resolverEnFamilia(n, fam, cat){
  let cands = cat.filter(p=>familiaProd(p)===fam);
  if(!cands.length) return null;
  const gr = gramajeDe(n);
  if(gr){ const porGr = cands.filter(p=>gramajesDe(p).includes(gr)); if(!porGr.length) return null; cands = porGr; }
  const variantes = [[/jalapen/],[/finas\s?hierbas|hierbas/],[/sin\s?sal/],[/tajad|rebanad|lonja/],[/entera|bloque|entero/]];
  variantes.forEach(([re])=>{
    if(cands.length<2) return;
    const quiere = re.test(n);
    const filtrado = cands.filter(p=>re.test(norm(p.nombre))===quiere);
    if(filtrado.length) cands = filtrado;
  });
  return cands.length===1 ? cands[0] : null;
}
const fueraCatalogo = p => (p.items||[]).filter(i=>i.producto && !enCatalogo(i.producto)).map(i=>i.producto);
/* Reescribe los items al nombre canónico cuando hay equivalencia clara */
function unificarItems(items){
  return (items||[]).map(i=>{
    if(!i.producto || enCatalogo(i.producto)) return i;
    const c = matchCatalogo(i.producto);
    return c ? {...i, producto:c.nombre, unidad:c.unidad||i.unidad} : i;
  });
}
/* Nombres que aparecen en los pedidos y no están en el catálogo */
function nombresSueltos(){
  const m = new Map();
  P().forEach(p=>(p.items||[]).forEach(i=>{
    if(!i.producto || enCatalogo(i.producto)) return;
    if(!m.has(i.producto)) m.set(i.producto, {nombre:i.producto, unidades:0, pedidos:new Set(), sugerido:matchCatalogo(i.producto)});
    const r = m.get(i.producto); r.unidades += (+i.cantidad||0); r.pedidos.add(p.id);
  }));
  return [...m.values()].sort((a,b)=>b.unidades-a.unidades);
}

/* Guarda un pedido completo (nuevo o editado) y mantiene coherencia con rutas y puntos. */
async function commitPedido(oldP, newP){
  const p = clone(newP);
  p.items = unificarItems(p.items);
  /* poner fecha de entrega es programar: promover ANTES de limpiar, o la fecha
     recién escrita se perdería por la regla de "Recibido" */
  if(p.fechaEntrega && p.estado==='Recibido') p.estado='Programado';
  if(p.estado==='Recibido'){ p.fechaEntrega=''; p.rutaId=''; p.parada=0; }
  if(p.rutaId){ const r=S.rutas.get(p.rutaId); if(r) p.fechaEntrega=r.fecha; else { p.rutaId=''; p.parada=0; } }
  if(p.estado==='Entregado' && !p.fechaEntregaReal) p.fechaEntregaReal=today();
  if(p.rutaId && (!oldP || oldP.rutaId!==p.rutaId)) p.parada = nextParada(p.rutaId);
  if(!oldP || oldP.estado!==p.estado) p.historial=[...(p.historial||[]),{ts:nowISO(),estado:p.estado}];
  await store.put('pedidos',p.id,p);
  if(p.cliente && !p.ejemplo){
    const id = slug(p.cliente+'|'+(p.sede||'general'));
    const prev = S.puntos.get(id);
    if(!prev || prev.ciudad!==p.ciudad || prev.direccion!==p.direccion)
      await store.put('puntos',id,{cliente:p.cliente,sede:p.sede||'',ciudad:p.ciudad||'',direccion:p.direccion||''});
  }
  await maybeCompletarRuta(p.rutaId);
  return p;
}
async function maybeCompletarRuta(rutaId){
  if(!rutaId) return; const r=S.rutas.get(rutaId); if(!r) return;
  const ps = paradasDe(rutaId);
  if(ps.length && ps.every(x=>x.estado==='Entregado') && r.estado!=='Completada') await store.patch('rutas',rutaId,{estado:'Completada'});
}

async function moverParada(pid, dir){
  const p = S.pedidos.get(pid); const ps = paradasDe(p.rutaId); const i = ps.findIndex(x=>x.id===pid); const j = i+dir;
  if(j<0 || j>=ps.length) return;
  const arr = ps.map(x=>x.id); [arr[i],arr[j]] = [arr[j],arr[i]];
  for(let k=0;k<arr.length;k++){ const q=S.pedidos.get(arr[k]); if(q.parada!==k+1) await store.patch('pedidos',arr[k],{parada:k+1}); }

  const ps = paradasDe(rid_); const sinListo = ps.filter(p=>p.estado==='Programado' && p.alistamiento!=='Listo');
  await store.patch('rutas',rid_,{estado:'En ruta'});
  for(const p of ps) if(p.estado==='Programado') await patchPedido(p.id,x=>{ x.estado='Despachado'; });
  toast(sinListo.length ? `Ruta en camino. Ojo: ${sinListo.length} pedido(s) salieron sin alistamiento "Listo".` : 'Ruta en camino', sinListo.length?'bad':undefined);

async function autoRutas(dia){
  const cand = P().filter(p=>p.fechaEntrega===dia && !p.rutaId && p.estado==='Programado').sort((a,b)=>(a.fechaRequerida||'9').localeCompare(b.fechaRequerida||'9'));
  if(!cand.length){ toast('No hay pedidos programados sin ruta para este día.'); return; }
  const groups = new Map(); cand.forEach(p=>{ const c=(p.ciudad||'Sin ciudad').trim(); if(!groups.has(c)) groups.set(c,[]); groups.get(c).push(p); });
  let made = 0;
  for(const [ciudad, ps] of groups){
    let r = [...S.rutas.values()].find(x=>x.fecha===dia && x.estado==='Planeada' && norm(x.nombre).includes(norm(ciudad)));
    let id = r && [...S.rutas].find(([,v])=>v===r)?.[0];
    if(!id){ id = await crearRuta(dia, `Ruta ${ciudad} · ${fmtD(dia)}`); made++; }
    for(const p of ps){ await asignarARuta(p.id, id); }
  }
  toast(`${cand.length} pedido(s) agrupados por ciudad en ${groups.size} ruta(s)`);
}

}

/* ================= filtros ================= */
function matchQ(p, q){
  if(!q) return true;
  const hay = norm([p.cliente,p.sede,p.ciudad,p.ocNumero,p.id,p.remitente,p.notas,(p.items||[]).map(i=>i.producto).join(' ')].join(' '));
  return norm(q).split(' ').filter(Boolean).every(t=>hay.includes(t));
}
function quickMatch(p){
  switch(S.f.quick){
    case 'sinprogramar': return p.estado==='Recibido' || (!p.fechaEntrega && p.estado!=='Entregado');
    case 'hoy': return p.fechaEntrega===today() && p.estado!=='Entregado';
    case 'enruta': return p.estado==='Despachado';
    case 'atrasados': return atrasado(p);
    case 'novedades': return tieneNov(p);
    default: return true;
  }
}
function visibles(list){
  return list.filter(p=>matchQ(p,S.f.q) && (!S.f.ciudad || p.ciudad===S.f.ciudad) && quickMatch(p));
}
const hayFiltro = () => !!(S.f.q || S.f.ciudad || S.f.quick);

function viewTablero(){
  const wrap = h('div',{});
  const list = visibles(P());
  const board = h('div',{class:'board'});
  ESTADOS.forEach(est=>{
    let ps = list.filter(p=>p.estado===est);
    if(est==='Entregado'){
      ps = ps.sort((a,b)=>(b.fechaEntregaReal||b.fechaEntrega||'').localeCompare(a.fechaEntregaReal||a.fechaEntrega||''));
      if(!S.showAllDelivered && !hayFiltro()) ps = ps.slice(0,5);
    } else {
      ps = ps.sort((a,b)=>((a.fechaEntrega||a.fechaRequerida||'9999')+a.id).localeCompare((b.fechaEntrega||b.fechaRequerida||'9999')+b.id));
    }
    const delEstado = list.filter(p=>p.estado===est);
    const total = delEstado.length;
    const und = delEstado.reduce((s,p)=>s+unidades(p),0);
    const stack = h('div',{class:'stack'});
    ps.forEach(p=>stack.append(pedidoCard(p,{showEstado:false})));
    if(!ps.length) stack.append(h('div',{class:'empty'}, est==='Recibido'?'Nada nuevo por revisar':'Sin pedidos aquí'));
    if(est==='Entregado' && total) stack.append(h('button',{class:'btn sm ghost', onClick:()=>go('entregados')},
      total>ps.length ? `Ver los ${total} entregados y el archivo` : 'Ver entregas y archivo'));
    board.append(h('div',{class:'col '+EK[est]},
      h('div',{class:'col-h'}, h('span',{class:'ic','aria-hidden':'true'}, EST_IC[est]), est,
        h('span',{class:'cnt'}, total, h('span',{class:'muted',style:'font-weight:500'}, und?` · ${fmtN(und)} und`:''))), stack));
  });
  if(!list.length && hayFiltro()) wrap.append(h('div',{class:'empty'},'Ningún pedido coincide con la búsqueda.'));
  wrap.append(board);
  return wrap;
}

    day.append(h('div',{class:'day-h'}, h('b',{}, DIAS_L[parseD(d).getDay()].slice(0,3)), h('small',{}, `${parseD(d).getDate()} ${MESES[parseD(d).getMonth()]}`)));

    const porRuta = new Map();
    ps.forEach(p=>{ const k = p.rutaId||''; if(!porRuta.has(k)) porRuta.set(k,[]); porRuta.get(k).push(p); });
    [...porRuta.entries()].sort((a,b)=>(a[0]?0:1)-(b[0]?0:1)).forEach(([rid_,list])=>{
      const r = rid_?S.rutas.get(rid_):null;
      const g = h('div',{class:'rgroup'},
        h('div',{class:'rgroup-h'}, h('span',{}, r? r.nombre : 'Sin ruta asignada'), h('span',{class:'chip'}, list.length)));
      list.forEach(p=>g.append(h('button',{class:'mini'+(p.estado==='Entregado'?' done':'')+(atrasado(p)?' late':''), draggable: p.estado!=='Entregado',
          onDragstart:e=>{ S.dragId=p.id; e.dataTransfer.effectAllowed='move'; e.dataTransfer.setData('text/plain',p.id); },
          onDragend:()=>{ S.dragId=null; },
          onClick:()=>openPedido(p.id)},
        h('span',{class:'t'}, p.cliente||'(sin cliente)'),
        h('span',{class:'s'}, [p.sede,p.ciudad].filter(Boolean).join(' · ')),
        h('span',{class:'chips'}, estadoChip(p), tieneNov(p)?h('span',{class:'chip bad'},'!'):null))));
      day.append(g);
    });
    if(!ps.length) day.append(h('div',{class:'empty'},'—'));
    days.append(day);
  }
  wrap.append(h('div',{class:'week'}, panel, h('div',{}, days)));
  return wrap;
}

/* ================= vista: alistamiento ================= */
const FILTROS_FECHA = [['','Todas las fechas'],['hoy','Entrega hoy'],['manana','Entrega mañana'],['semana','Entrega esta semana'],['sinfecha','Sin fecha asignada']];
function pasaFecha(p){
  const f = S.aliFecha||'';
  if(!f) return true;
  if(f==='sinfecha') return !p.fechaEntrega;
  if(f==='hoy') return p.fechaEntrega===today();
  if(f==='manana') return p.fechaEntrega===addDays(today(),1);
  if(f==='semana'){ const ws=mondayOf(today()); return p.fechaEntrega>=ws && p.fechaEntrega<=addDays(ws,6); }
  return true;
}
function baseAlistamiento(){
  const scope = S.aliScope || 'pend';
  const ciudad = S.aliCiudad || '';
  return P().filter(p=>(scope==='todo' || p.estado!=='Entregado') && (!ciudad || p.ciudad===ciudad) && pasaFecha(p) &&
    (!S.aliSoloFalta || (p.estado!=='Entregado' && p.alistamiento!=='Listo')));
}
function consolidar(pedidos){
  const m = new Map();
  pedidos.forEach(p=>soloMercancia(p.items).forEach(i=>{
    if(!i.producto) return;
    if(!m.has(i.producto)) m.set(i.producto,{producto:i.producto, unidad:i.unidad||'und', cantidad:0, peso:0, pesoIncompleto:false});
    const r = m.get(i.producto);
    r.cantidad += (+i.cantidad||0);
    const w = pesoItem(i);
    if(w==null) r.pesoIncompleto = true; else r.peso += w;
  }));
  const orden = cfgProductos().map(x=>x.nombre);
  return [...m.values()].sort((a,b)=>{
    const ia=orden.indexOf(a.producto), ib=orden.indexOf(b.producto);
    return (ia<0?9999:ia)-(ib<0?9999:ib) || a.producto.localeCompare(b.producto);
  });
}
const totalUnd = pedidos => pedidos.reduce((s,p)=>s+unidades(p),0);

function viewAlistamiento(){
  const wrap = h('div',{});

    h('span',{style:'margin-left:auto;display:flex;gap:8px;flex-wrap:wrap'},
      h('button',{class:'btn sm', onClick:()=>copiar(alistamientoTxt(),'Lista copiada — pégala en WhatsApp')},'Copiar lista'),
      S.dl ? h('button',{class:'btn sm', onClick:()=>descargarAlistamiento()},'Descargar CSV') : null)));

  const cons = consolidar(lista);

  const puntos = new Set(lista.map(p=>slug(p.cliente+'|'+p.sede))).size;
  const stats = h('div',{class:'kpis', style:'margin-bottom:14px'});
  [[fmtN(totalUnd(lista)),'Unidades en total',''],

/* ---- por producto: consolidado y totales por estado ---- */
function bloquePorProducto(lista, scope){
  const box = h('div',{});
  const cols = scope==='todo' ? ESTADOS : ESTADOS.slice(0,3);
  const m = new Map();
  lista.forEach(p=>soloMercancia(p.items).forEach(i=>{
    if(!i.producto) return;
    if(!m.has(i.producto)) m.set(i.producto,{producto:i.producto, unidad:i.unidad||'und', tot:0, alistar:0, peso:0, pesoIncompleto:false, pedidos:new Set()});
    const r=m.get(i.producto), q=+i.cantidad||0;
    r[p.estado]=(r[p.estado]||0)+q; r.tot+=q; r.pedidos.add(p.id);
    const w = pesoItem(i); if(w==null) r.pesoIncompleto=true; else r.peso+=w;
    if(p.estado!=='Entregado' && !i.alistado) r.alistar+=q;
  }));
  const orden = cfgProductos().map(x=>x.nombre);
  const rows = [...m.values()].sort((a,b)=>{
    const ia=orden.indexOf(a.producto), ib=orden.indexOf(b.producto);
    return (ia<0?9999:ia)-(ib<0?9999:ib) || a.producto.localeCompare(b.producto);
  });
  const thead = h('tr',{}, h('th',{},'Producto'), ...cols.map(c=>h('th',{class:'r'},c)), h('th',{class:'r'},'Total'), h('th',{class:'r'},'Peso'), h('th',{class:'r'},'Por alistar'));
  const tbody = h('tbody',{});
  rows.forEach(r=>tbody.append(h('tr',{},
    h('td',{}, h('div',{style:'font-weight:600'}, r.producto, !enCatalogo(r.producto)?h('span',{class:'chip warn',style:'margin-left:6px'},'sin unificar'):null),
      h('div',{class:'muted',style:'font-size:12px'}, `${r.pedidos.size} pedido(s) · ${r.unidad}`)),
    ...cols.map(c=>h('td',{class:'r'+(r[c]?'':' muted')}, r[c]?fmtN(r[c]):'—')),
    h('td',{class:'r',style:'font-weight:700'}, fmtN(r.tot)),
    h('td',{class:'r'+(r.peso?'':' muted')}, r.peso?fmtPeso(r.peso,r.pesoIncompleto):'—'),
    h('td',{class:'r'+(r.alistar?'':' muted')}, r.alistar?fmtN(r.alistar):'—'))));
  const sum = f => rows.reduce((s,r)=>s+(f(r)||0),0);
  const incompleto = rows.some(r=>r.pesoIncompleto);
  tbody.append(h('tr',{style:'background:var(--surface-2)'},
    h('td',{style:'font-weight:700'},'Total general'),
    ...cols.map(c=>h('td',{class:'r',style:'font-weight:700'}, fmtN(sum(r=>r[c])))),
    h('td',{class:'r',style:'font-weight:700'}, fmtN(sum(r=>r.tot))),
    h('td',{class:'r',style:'font-weight:700'}, fmtPeso(sum(r=>r.peso), incompleto)),
    h('td',{class:'r',style:'font-weight:700'}, fmtN(sum(r=>r.alistar)))));
  box.append(h('div',{class:'tablewrap'}, h('table',{}, h('thead',{}, thead), tbody)));
  box.append(h('p',{class:'muted',style:'margin-top:10px'},'"Por alistar" son las unidades que todavía no has marcado como empacadas en la pestaña "Por punto". El peso sale del gramaje de cada referencia; un "+" delante significa que algún renglón no tiene gramaje definido y el peso real es mayor.'));
  return box;
}

function alistamientoTxt(){

function descargarAlistamiento(){
  const lista = baseAlistamiento();
  const esc = v=>`"${String(v??'').replace(/"/g,'""')}"`;
  const kg = g => g==null?'':String(Math.round(g)/1000).replace('.',',');
  const out = [['Cliente','Punto','Ciudad','OC','Entrega','Estado','Alistamiento','Producto','Cantidad','Unidad','Peso (kg)','Alistado'].map(esc).join(';')];
  lista.forEach(p=>(p.items||[]).forEach(i=>out.push(
    [p.cliente,p.sede,p.ciudad,p.ocNumero,p.fechaEntrega,p.estado,p.alistamiento,i.producto,i.cantidad,i.unidad,kg(pesoItem(i)),i.alistado?'Sí':'No'].map(esc).join(';'))));
  out.push('');
  out.push(['CONSOLIDADO','','','','','','','Producto','Cantidad','Unidad','Peso (kg)',''].map(esc).join(';'));
  consolidar(lista).forEach(x=>out.push(['','','','','','','',x.producto,x.cantidad,x.unidad,kg(x.peso),''].map(esc).join(';')));
  const wt = pesoLista(lista);
  out.push(['TOTAL','','','','','','','',totalUnd(lista),'und',kg(wt.g),''].map(esc).join(';'));
  descargar(`alistamiento-patria-${today()}.csv`, '﻿'+out.join('\r\n'));
}

function csvRuta(rid_){
  const ps = paradasDe(rid_); const r = S.rutas.get(rid_);

  const kg = g => g==null?'':String(Math.round(g)/1000).replace('.',',');
  const rows = [['Parada','Cliente','Sede','Ciudad','Dirección','OC','Producto','Cantidad','Unidad','Peso (kg)','Estado']];
  ps.forEach((p,i)=>(p.items||[]).forEach(it=>rows.push([i+1,p.cliente,p.sede,p.ciudad,p.direccion,p.ocNumero,it.producto,it.cantidad,it.unidad,kg(pesoItem(it)),p.estado])));
  rows.push([]);

function closeDrawer(){ $('#drawer-root').textContent=''; S.drawer=null; document.body.style.overflow=''; }
function openDrawer(title, bodyFn, footFn, opts={}){
  const root = $('#drawer-root'); root.textContent='';
  const body = h('div',{class:'drawer-b'});
  const foot = h('div',{class:'drawer-f'});
  const dr = h('div',{class:'drawer', role:'dialog', 'aria-modal':'true', 'aria-label':title},
    h('div',{class:'drawer-h'}, h('h2',{}, title), h('button',{class:'btn ghost sm', 'aria-label':'Cerrar', onClick:closeDrawer},'Cerrar ✕')),
    body, foot);
  root.append(h('div',{class:'scrim', onClick:()=>{ if(!opts.sticky) closeDrawer(); }}), dr);
  document.body.style.overflow='hidden';
  S.drawer = title;
  const ctx = {reload:()=>{ body.textContent=''; foot.textContent=''; bodyFn(body, ctx); footFn && footFn(foot, ctx); }};
  bodyFn(body, ctx);
  footFn && footFn(foot, ctx);
  document.addEventListener('keydown', function esc(e){ if(e.key==='Escape'&&!opts.sticky){ closeDrawer(); document.removeEventListener('keydown',esc); } });
  setTimeout(()=>{ const f = dr.querySelector('input,select,textarea,button'); f&&f.focus(); },30);
  return {body, foot};
}

    h('div',{class:'modal-h'}, h('h2',{}, title), h('button',{class:'btn ghost sm', 'aria-label':'Cerrar', onClick:closeModal},'✕')),
    body, foot);
  root.append(h('div',{class:'scrim modal-scrim', onClick:closeModal}), caja);
  const ctx = {reload:()=>{ body.textContent=''; foot.textContent=''; bodyFn(body, ctx); footFn && footFn(foot, ctx); }};
  bodyFn(body, ctx); footFn && footFn(foot, ctx);
  document.addEventListener('keydown', function esc(ev){ if(ev.key==='Escape'){ closeModal(); document.removeEventListener('keydown',esc); } });

}

        if('precio' in it && !it.precio) it.precio = +prod.precio||0;
        onChange && onChange();
        renderAll();
      });
      return;
    }
    it.producto = e.target.value;
    const c = cfgProductos().find(p=>p.nombre===e.target.value);
    if(c) it.unidad = c.unidad || it.unidad;
    onChange && onChange();

/* ================= nuevo pedido: lectura de OC y varios puntos ================= */
const EXTRACT_RULES = `Eres el asistente de despachos de Búfalos y Lácteos PATRIA, productora colombiana de lácteos de búfala.
Recibes una orden de compra —un correo reenviado, un PDF pegado, un mensaje de WhatsApp del mercaderista o la FOTO de una orden impresa o escrita a mano— y devuelves SOLO un objeto JSON.

Una misma orden puede cubrir VARIOS puntos de entrega (por ejemplo una cadena que pide para sus almacenes de Pereira, Armenia y Dosquebradas). Por eso el JSON tiene una lista "destinos": un elemento por punto, cada uno con sus propias cantidades. Si la orden es para un solo punto, "destinos" trae un solo elemento.

Formato exacto:
{"cliente":"","ocNumero":"","canal":"Correo|WhatsApp|Otro","remitente":"","fechaRequerida":"YYYY-MM-DD","notas":"","confianza":"alta|media|baja","faltantes":[],
 "destinos":[{"sede":"","ciudad":"","direccion":"","fechaRequerida":"YYYY-MM-DD","items":[{"producto":"","cantidad":0,"unidad":"und|caja|kg|paquete"}]}]}

Reglas:
- "cliente" es la cadena o el negocio que compra (Euro, Supermú, una pizzería). "sede" es el punto o almacén específico de esa cadena.
- Si la orden trae una tabla con una columna por almacén o una fila por almacén, crea un destino por cada uno y reparte las cantidades como aparecen. No sumes los puntos en uno solo.
- "producto" debe ser SIEMPRE uno de los nombres EXACTOS del catálogo de abajo, copiado carácter por carácter. Respeta el gramaje: "mozzarella tajada de 250" es "Mozzarella Tajada 250 g", no la de 500 g.
- Si un renglón no corresponde con claridad a ningún producto del catálogo, copia el nombre tal como aparece y menciónalo en "faltantes". Nunca lo fuerces al producto más parecido.
- Las cantidades son números. Si dicen "2 cajas de 12", pon cantidad 2 y unidad "caja" y explícalo en "notas".
- Fechas en formato YYYY-MM-DD. Interpreta fechas relativas ("para el viernes", "mañana") con la fecha de hoy que te doy. Si no hay fecha, deja "". La fecha de arriba aplica a toda la orden; usa la del destino solo si ese punto tiene una fecha distinta.
- Un mensaje informal de WhatsApp es canal "WhatsApp"; un correo reenviado es "Correo".
- "faltantes" lista en español los datos importantes que no aparecen (por ejemplo "fecha requerida", "dirección del punto").
- Si la imagen está borrosa o hay un número que no se lee con seguridad, ponlo en "faltantes" y baja la "confianza". Nunca inventes cantidades, precios ni fechas.`;
function promptExtraccion(texto, conImagen){
  const cat = cfgProductos().map(p=>'- '+p.nombre).join('\n');
  const fuente = conImagen
    ? (texto.trim() ? 'La orden viene en la(s) imagen(es) adjunta(s). Texto adicional que acompaña la orden:\n"""\n'+texto.slice(0,8000)+'\n"""'
                    : 'La orden viene en la(s) imagen(es) adjunta(s). Léela de ahí.')
    : 'Orden de compra recibida:\n"""\n'+texto.slice(0,12000)+'\n"""';
  return [{role:'user', content: EXTRACT_RULES +
    `\n\nHoy es ${today()} (${fmtLong(today())}).\n\nCatálogo de productos:\n${cat}\n\nCiudades donde despachamos: ${cfgCiudades().join(', ')}.\n\n${fuente}\n\nResponde solo con el JSON.`}];
}
function destinoVacio(){ return {sede:'', ciudad:'', direccion:'', fechaRequerida:'', items:[{producto:'',cantidad:1,unidad:'und'}], notas:''}; }
function cabeceraVacia(){ return {cliente:'', ocNumero:'', canal:'Correo', remitente:'', fechaRecibido:today(), fechaRequerida:'', notas:'', textoOriginal:''}; }
function normalizarExtraido(d){
  const cab = cabeceraVacia();
  cab.cliente = String(d.cliente||'').trim();
  cab.ocNumero = String(d.ocNumero||'').trim();
  cab.remitente = String(d.remitente||'').trim();
  cab.canal = CANALES.includes(d.canal) ? d.canal : 'Correo';
  cab.notas = String(d.notas||'').trim();
  const fecha = f => /^\d{4}-\d{2}-\d{2}$/.test(String(f||'').trim()) ? String(f).trim() : '';
  cab.fechaRequerida = fecha(d.fechaRequerida);
  const crudos = Array.isArray(d.destinos) && d.destinos.length ? d.destinos : [{}];
  const destinos = crudos.map(x=>{
    const dd = destinoVacio();
    dd.sede = String(x&&x.sede||'').trim();
    dd.ciudad = String(x&&x.ciudad||'').trim();
    dd.direccion = String(x&&x.direccion||'').trim();
    dd.fechaRequerida = fecha(x&&x.fechaRequerida);
    const items = Array.isArray(x&&x.items)?x.items:[];
    dd.items = items.map(i=>{
      const crudo = String(i&&i.producto||'').trim();
      const c = matchCatalogo(crudo);
      return {producto: c?c.nombre:crudo, cantidad: Math.max(0,Math.round(+(i&&i.cantidad)||0)),
        unidad: c ? c.unidad : (UNIDADES.includes(i&&i.unidad)?i.unidad:'und')};
    }).filter(i=>i.producto);
    if(!dd.items.length) dd.items = [{producto:'',cantidad:1,unidad:'und'}];
    if(!dd.ciudad){ const pt = puntoDe(cab.cliente, dd.sede); if(pt){ dd.ciudad = pt.ciudad||''; dd.direccion = dd.direccion||pt.direccion||''; } }
    return dd;
  });
  return {cab, destinos};
}
function pedidosDesde(cab, destinos){
  const gid = destinos.length>1 ? nuevoGrupoId(cab.cliente, cab.ocNumero) : '';
  const usados = new Set(P().map(p=>p.id));
  return destinos.map(d=>{
    const p = newPedido();
    let id; do { id = nuevoId(cab.fechaRecibido||today()); } while(usados.has(id));
    usados.add(id);
    Object.assign(p, {
      id, cliente:cab.cliente.trim(), ocNumero:cab.ocNumero.trim(), canal:cab.canal, remitente:cab.remitente.trim(),
      fechaRecibido:cab.fechaRecibido||today(), fechaRequerida:d.fechaRequerida||cab.fechaRequerida,
      sede:d.sede.trim(), ciudad:d.ciudad.trim(), direccion:d.direccion.trim(),
      items:d.items.filter(i=>i.producto.trim() && +i.cantidad>0),
      notas:[cab.notas, d.notas].filter(Boolean).join(' · '), grupoId:gid,
      textoOriginal:cab.textoOriginal||''
    });
    return p;
  });
}
function validarOrden(cab, destinos){
  if(!cab.cliente.trim()) return 'Escribe el nombre del cliente.';
  if(!destinos.length) return 'Agrega al menos un punto de entrega.';
  for(const d of destinos){
    const its = d.items.filter(i=>i.producto.trim() && +i.cantidad>0);
    if(!its.length) return `El punto "${d.sede||'sin nombre'}" no tiene productos con cantidad.`;
    d.items = its;
  }
  if(destinos.length>1){
    const claves = destinos.map(d=>norm(d.sede));
    if(new Set(claves).size !== claves.length) return 'Hay dos puntos con el mismo nombre. Diferéncialos o únelos en uno solo.';
  }
  return null;
}

function openNuevo(){
  if(!puede('pedidos.crear')){ toast('Tu rol no permite crear pedidos.','bad'); return; }
  let modo = S.sample ? 'ia' : 'form';
  let texto = '', imgs = [], ctl = null;
  let cab = cabeceraVacia(), destinos = [destinoVacio()], leido = false;
  let faltantes = [], confianza = '';
  const urls = [];
  const limpiar = ()=>{ urls.forEach(u=>URL.revokeObjectURL(u)); urls.length=0; };

  openDrawer('Nuevo pedido', (body, ctx)=>{
    const pane = h('div',{class:'stack', style:'gap:18px'});
    if(S.sample && !leido) pane.append(h('div',{class:'seg'},
      h('button',{'aria-pressed':modo==='ia', onClick:()=>{ modo='ia'; ctx.reload(); }},'Leer la orden'),

      const ta = h('textarea',{class:'textarea pre', placeholder:'Pega aquí el correo con la orden de compra, o el mensaje de WhatsApp del mercaderista tal como llegó.', onInput:e=>texto=e.target.value});
      ta.value = texto;
      const thumbs = h('div',{class:'thumbs'});
      const pintarThumbs = ()=>{
        thumbs.textContent='';
        imgs.forEach((f,i)=>{
          const u = URL.createObjectURL(f); urls.push(u);
          thumbs.append(h('div',{style:'position:relative'},
            h('img',{src:u, alt:'Foto de la orden '+(i+1)}),
            h('button',{class:'btn ghost sm icon', style:'position:absolute;top:2px;right:2px;background:var(--surface)', 'aria-label':'Quitar foto',
              onClick:()=>{ imgs.splice(i,1); pintarThumbs(); }},'✕')));
        });
        if(imgs.length) thumbs.append(h('span',{class:'muted', style:'align-self:center'}, `${imgs.length} foto(s)`));
      };
      const fileInput = h('input',{type:'file', accept:(S.imgLimits&&S.imgLimits.mediaTypes.join(','))||'image/*', multiple:true, style:'display:none',
        onChange:e=>{ agregarFotos([...e.target.files]); }});
      const max = (S.imgLimits&&S.imgLimits.maxCount)||5;
      function agregarFotos(fs){
        const nuevas = fs.filter(f=>/^image\//.test(f.type));
        imgs = [...imgs, ...nuevas].slice(0, max);
        if(fs.length && !nuevas.length) toast('Solo puedo leer fotos o capturas de imagen.','bad');
        pintarThumbs();
      }
      const zona = h('div',{class:'dropzone', role:'button', tabindex:'0',
        onClick:()=>fileInput.click(), onKeydown:e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); fileInput.click(); } },
        onDragover:e=>{ e.preventDefault(); zona.classList.add('over'); },
        onDragleave:()=>zona.classList.remove('over'),
        onDrop:e=>{ e.preventDefault(); zona.classList.remove('over'); agregarFotos([...e.dataTransfer.files]); }},
        h('b',{},'Toma o sube una foto de la orden'),
        h('div',{},'Sirve una foto del papel, una captura de WhatsApp o el PDF en pantalla. Hasta '+max+' imágenes.'));
      pintarThumbs();

      const estado = h('div',{});
      const btn = h('button',{class:'btn primary', onClick:async()=>{
        if(!texto.trim() && !imgs.length){ toast('Pega el texto de la orden o sube una foto.','bad'); return; }
        btn.disabled = true; estado.textContent='';
        estado.append(h('div',{class:'notice info'}, h('span',{class:'spin'}), h('span',{},'Leyendo la orden…')));
        ctl = new AbortController();
        try{
          const d = await S.sample.json(promptExtraccion(texto, !!imgs.length),
            {signal:ctl.signal, modelTier:'default', images: imgs.length?imgs:undefined, cache:false});
          const r = normalizarExtraido(d);
          cab = r.cab; cab.textoOriginal = texto; destinos = r.destinos;
          faltantes = Array.isArray(d.faltantes)?d.faltantes.map(String):[];
          confianza = String(d.confianza||'');
          leido = true; modo = 'form'; ctx.reload();
        }catch(e){
          console.error(e);
          const map = {not_granted:'Tu usuario no puede usar la lectura automática. Escribe el pedido a mano.',
            rate_limited:'Claude está ocupado ahora mismo. Espera un momento o escribe el pedido a mano.',
            invalid_json:'No pude leer bien esa orden. Prueba con una foto más nítida o escribe el pedido a mano.',
            image_rejected:'Esa imagen no la pude abrir. Prueba con otra foto o una captura.',
            images_unavailable:'Desde este dispositivo no puedo leer fotos. Pega el texto de la orden.',
            cancelled:'', refused:'No pude procesar ese contenido. Escribe el pedido a mano.'};
          const m = map[e.code] !== undefined ? map[e.code] : 'No pude leer la orden. Escribe el pedido a mano.';
          estado.textContent=''; if(m) estado.append(h('div',{class:'notice bad'}, m));
          if(e.code==='not_granted'||e.code==='sampling_disabled'){ S.sample=null; modo='form'; ctx.reload(); }
        }finally{ btn.disabled=false; }
      }},'Leer con Claude');

      pane.append(
        h('p',{class:'muted'},'Claude lee la orden y arma el pedido: cliente, número de OC, productos, cantidades y fechas. Si la orden cubre varios almacenes, crea un punto de entrega por cada uno. Tú revisas antes de guardar.'),
        ta, zona, fileInput, thumbs,
        h('div',{style:'display:flex;gap:8px;flex-wrap:wrap'}, btn,
          h('button',{class:'btn', onClick:()=>{ cab.textoOriginal=texto; modo='form'; ctx.reload(); }},'Mejor lo escribo a mano')),
        estado);
      body.append(pane);
      return;
    }

    /* ---- formulario ---- */
    if(leido){
      if(faltantes.length) pane.append(h('div',{class:'notice warn'},'Revisa: la orden no traía '+faltantes.join(', ')+'.'));
      if(confianza==='baja') pane.append(h('div',{class:'notice warn'},'Claude no quedó seguro de esta lectura. Verifica punto por punto antes de guardar.'));
      if(destinos.length>1) pane.append(h('div',{class:'notice info'},`Leí una orden para ${destinos.length} puntos de entrega. Se van a crear ${destinos.length} pedidos enlazados a la misma OC.`));
    }
    pane.append(cabeceraForm(cab, ctx));

    const resumen = h('div',{class:'resumen'});
    function pintarResumen(){
      resumen.hidden = destinos.length<2;
      if(resumen.hidden) return;
      const cons = consolidar(destinos.map(d=>({items:d.items})));
      resumen.textContent='';
      resumen.append(h('div',{class:'eyebrow'},'Consolidado de la orden'),
        h('div',{class:'chips'}, ...cons.map(x=>h('span',{class:'chip'}, `${fmtN(x.cantidad)} ${x.unidad} · ${x.producto}`))),
        h('div',{style:'font-weight:700'}, `${fmtN(cons.reduce((s,x)=>s+x.cantidad,0))} unidades en ${destinos.length} puntos`));
    }
    const secD = h('div',{class:'sect'});
    secD.append(h('div',{class:'eyebrow'}, destinos.length>1 ? `Puntos de entrega (${destinos.length})` : 'Punto de entrega'));
    destinos.forEach((d,i)=>secD.append(destinoCard(cab, d, i, destinos, ctx, pintarResumen)));
    secD.append(h('button',{class:'btn sm', onClick:()=>{ destinos.push(destinoVacio()); ctx.reload(); }},'+ Agregar otro punto de esta misma orden'));
    pane.append(secD);
    pintarResumen();
    pane.append(resumen);
    if(cab.textoOriginal) pane.append(h('details',{class:'raw'}, h('summary',{},'Texto original de la orden'), h('pre',{}, cab.textoOriginal)));
    body.append(pane);
  }, (foot, ctx)=>{
    const guardarOrden = async (conRemision)=>{
      const err = validarOrden(cab, destinos); if(err){ toast(err,'bad'); return; }
      const nuevos = pedidosDesde(cab, destinos);
      const ok = await safe(async()=>{ for(const p of nuevos) await commitPedido(null, p); return true; });
      if(!ok) return;
      limpiar(); closeDrawer();
      if(conRemision){
        const base = S.pedidos.get(nuevos[0].id) || nuevos[0];
        S.rem = remDesdePedido(base);
        S.view = 'remision';
        renderAll();
        toast(nuevos.length>1
          ? `${nuevos.length} pedidos creados. Esta es la remisión de ${base.sede||base.ciudad||'el primer punto'}; las demás las armas desde Remisión → Desde un pedido.`
          : 'Pedido registrado. Revisa la remisión y guárdala.');
        return;
      }
      toast(nuevos.length>1 ? `${nuevos.length} pedidos creados desde la OC ${cab.ocNumero||''}`.trim() : 'Pedido registrado');
    };
    foot.append(h('button',{class:'btn ghost', onClick:()=>{ ctl&&ctl.abort(); limpiar(); closeDrawer(); }},'Cancelar'),
      h('div',{class:'grp'},
        h('button',{class:'btn', onClick:()=>guardarOrden(true)},'Guardar y hacer remisión'),
        h('button',{class:'btn primary', onClick:()=>guardarOrden(false)},
          destinos.length>1 ? `Guardar ${destinos.length} pedidos` : 'Guardar pedido')));
  }, {sticky:true});
}

function destinoCard(cab, d, i, destinos, ctx, onCambio){
  const card = h('div',{class:'destino'});
  const sumUnd = ()=>(d.items||[]).reduce((s,x)=>s+(+x.cantidad||0),0);
  const chipUnd = h('span',{class:'chip'}, `${fmtN(sumUnd())} und`);
  card.append(h('div',{class:'destino-h'},
    h('b',{}, destinos.length>1 ? `Punto ${i+1}${d.sede?' — '+d.sede:''}` : (d.sede||'Punto de entrega')),
    h('span',{style:'display:flex;gap:8px;align-items:center'},
      chipUnd,
      destinos.length>1 ? h('button',{class:'btn ghost sm icon', 'aria-label':'Quitar este punto', onClick:()=>{ destinos.splice(i,1); ctx.reload(); }},'✕') : null)));
  const dup = P().filter(p=>norm(p.cliente)===norm(cab.cliente) && norm(p.sede)===norm(d.sede) && p.estado!=='Entregado' &&
    cab.ocNumero && norm(p.ocNumero)===norm(cab.ocNumero));
  if(dup.length) card.append(h('div',{class:'notice bad'}, `Ya hay un pedido de ${dup[0].cliente}${dup[0].sede?' — '+dup[0].sede:''} con esa misma OC. ¿Lo estás registrando dos veces?`));
  card.append(h('div',{class:'grid3'},
    field('Sede o punto', h('input',{class:'input', value:d.sede, placeholder:'Pereira, Centro…', onInput:e=>{ d.sede=e.target.value; const pt=puntoDe(cab.cliente,d.sede); if(pt&&!d.ciudad){ d.ciudad=pt.ciudad||''; d.direccion=d.direccion||pt.direccion||''; ctx.reload(); } }})),
    field('Ciudad', h('input',{class:'input', list:'dl-ciudades', value:d.ciudad, onInput:e=>d.ciudad=e.target.value})),
    field('Fecha requerida', h('input',{class:'input', type:'date', value:d.fechaRequerida, onChange:e=>d.fechaRequerida=e.target.value}),'Solo si difiere')));
  card.append(field('Dirección', h('input',{class:'input', value:d.direccion, placeholder:'Para la hoja de ruta', onInput:e=>d.direccion=e.target.value})));
  card.append(itemsEditor(d, ()=>{ chipUnd.textContent = `${fmtN(sumUnd())} und`; onCambio && onCambio(); }));
  return card;
}

async function unificarNombre(viejo, nuevoNombre){
  const prod = prodDe(nuevoNombre); if(!prod) return 0;
  let n = 0;
  for(const p of P()){
    if(!(p.items||[]).some(i=>i.producto===viejo)) continue;
    await patchPedido(p.id, x=>{ (x.items||[]).forEach(i=>{ if(i.producto===viejo){ i.producto=prod.nombre; i.unidad=prod.unidad||i.unidad; } }); });
    n++;
  }
  const cfg = clone(S.config);
  const t = (cfg.productos||[]).find(x=>norm(x.nombre)===norm(prod.nombre));
  if(t){ t.alias = [...new Set([...(t.alias||[]), norm(viejo)])].slice(0,20); await store.put('config','app',cfg); }
  return n;
}

  if(p.servicio){
    card.append(h('div',{class:'notice info'},'Servicio: se cobra en la remisión pero no se alista, no pesa y no entra al archivo de entregas.'));

      campoNum('Peso real por unidad (g)', p.pesoUnitario, v=>{ p.pesoUnitario=v; S.prodTocado&&S.prodTocado(); }, 'Lo que pesa de verdad'),
      campoNum('Precio', p.precio, v=>{ p.precio=v; S.prodTocado&&S.prodTocado(); }, 'Valor por defecto en la remisión')));
    card.append(h('div',{class:'grid2'},
      campoNum('Unidades por caja', p.undPorCaja, v=>{ p.undPorCaja=v; S.prodTocado&&S.prodTocado(); }, 'Opcional'),
      field('Unidad', select(UNIDADES, p.unidad||'und', v=>{ p.unidad=v; S.prodTocado&&S.prodTocado(); }))));

/* Control compartido de IVA: casilla + porcentaje, 19% por defecto */
function campoIva(obj, onChange){
  const num = h('input',{class:'input', type:'number', min:'0', max:'100', step:'0.5', style:'width:96px',
    'aria-label':'Porcentaje de IVA', value: (+obj.ivaPct||0)>0 ? obj.ivaPct : IVA_DEF,
    onInput:e=>{ obj.ivaPct = Math.max(0, Math.min(100, +e.target.value||0)); pintar(); onChange&&onChange(); }});
  const etiqueta = h('span',{class:'muted', style:'font-size:12.5px'});
  const chk = h('input',{type:'checkbox', checked:(+obj.ivaPct||0)>0, 'aria-label':'Cobra IVA',
    onChange:e=>{ obj.ivaPct = e.target.checked ? (+num.value||IVA_DEF) : 0; pintar(); onChange&&onChange(); }});
  function pintar(){
    const grava = (+obj.ivaPct||0) > 0;
    num.disabled = !grava;
    num.style.opacity = grava ? '1' : '.45';
    etiqueta.textContent = grava ? 'Se suma al valor del renglón' : 'Producto exento';
  }
  pintar();
  return h('div',{class:'field'},
    h('label',{},'IVA'),
    h('div',{style:'display:flex;gap:10px;align-items:center;flex-wrap:wrap'},
      h('label',{class:'check'}, chk, h('span',{},'Cobra IVA')),
      num, h('span',{class:'muted'},'%'), etiqueta));
}

function siguienteNumero(){
  const pre = S.config.remPrefijo || 'RM';
  const n = +S.config.remConsecutivo || 1;
  return `${pre}-${String(n).padStart(4,'0')}`;

function remVacia(){
  return { numero:siguienteNumero(), fecha:today(), cliente:'', nit:'', sede:'', ciudad:'', direccion:'', telefono:'',
    items:[{producto:'',cantidad:1,unidad:'und',precio:0,ivaPct:0}], observaciones:'', pedidoId:'' };

function remDesdePedido(p){
  const r = remVacia();
  r.cliente = p.cliente||''; r.sede = p.sede||''; r.ciudad = p.ciudad||''; r.direccion = p.direccion||''; r.pedidoId = p.id;
  r.items = (p.items||[]).map(i=>{ const c = prodDe(i.producto); return {producto:i.producto, cantidad:+i.cantidad||0, unidad:i.unidad||'und', precio: c?(+c.precio||0):0, ivaPct: c?(+c.ivaPct||0):0}; });
  if(!r.items.length) r.items = [{producto:'',cantidad:1,unidad:'und',precio:0,ivaPct:0}];
  return r;
}
const baseItem = i => (+i.cantidad||0)*(+i.precio||0);
const ivaItem = i => baseItem(i) * (+i.ivaPct||0) / 100;
const remSubtotal = r => (r.items||[]).reduce((s,i)=>s+baseItem(i),0);
const remIva = r => (r.items||[]).reduce((s,i)=>s+ivaItem(i),0);
const remTotal = r => remSubtotal(r) + remIva(r);
const remGrava = r => (r.items||[]).some(i=>(+i.ivaPct||0)>0 && baseItem(i)>0);
/* IVA agrupado por tarifa, para desglosarlo cuando hay varias */
function remIvaPorTarifa(r){
  const m = new Map();
  (r.items||[]).forEach(i=>{ const p=+i.ivaPct||0; if(!p || !baseItem(i)) return;
    if(!m.has(p)) m.set(p,{pct:p, base:0, valor:0});
    const x=m.get(p); x.base+=baseItem(i); x.valor+=ivaItem(i); });
  return [...m.values()].sort((a,b)=>a.pct-b.pct);
}
/* No anunciar exención cuando la remisión sí lleva IVA */
function notaPieDe(r){
  const nota = (S.config.emisor||{}).notaPie || '';
  if(!remGrava(r)) return nota;
  return nota.split(/(?<=\.)\s+/).filter(f=>!/exent/i.test(f)).join(' ').trim();
}
